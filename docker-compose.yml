# Coolify deploys this directly (Build Pack: Docker Compose). Everything the
# app needs is one service, one port and one volume.
#
# Secrets are NOT in this file: set them in Coolify's Environment Variables tab
# (or an .env next to this file for a plain `docker compose up`). Only
# ANTHROPIC_API_KEY or OPENAI_API_KEY is strictly required — the rest degrade
# to "that data source is unavailable" rather than failing the app.

services:
  stock-cli:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4317
      CACHE_DIR: /data
      # Cron schedules are interpreted in the timezone stored in app-config.json;
      # this only sets the container's own clock display.
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      PPLX_API_KEY: ${PPLX_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DISTILL_API_KEY: ${DISTILL_API_KEY:-}
      DISTILL_API_URL: ${DISTILL_API_URL:-http://localhost:3000}
      DISTILL_BRIEFING_TYPE_ID: ${DISTILL_BRIEFING_TYPE_ID:-}
    ports:
      - '${PORT:-4317}:4317'
    volumes:
      # Named volume, not a bind mount: Docker seeds it from the image, so /data
      # arrives owned by the unprivileged `node` user the container runs as.
      - stock-cache:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4317/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  stock-cache:
