# Coolify deploys this directly (Build Pack: Docker Compose). Two services now:
# the app and its Postgres. Postgres is what holds the record of how every
# number moved — the app container itself is disposable.
#
# Secrets are NOT in this file: set them in Coolify's Environment Variables tab
# (or an .env next to this file for a plain `docker compose up`). Only
# ANTHROPIC_API_KEY or OPENAI_API_KEY is strictly required — the rest degrade
# to "that data source is unavailable" rather than failing the app.
#
# Every knob the app reads appears here as a ${VAR} reference even when it has a
# usable default, because that is what Coolify parses to pre-populate its
# Environment Variables tab. A variable the app reads but this file never names
# is one nobody can set from the UI — they have to know it exists first.
#
# Two identifiers use Coolify's generated-value syntax (SERVICE_*): Coolify
# fills them on first deploy and keeps them stable afterwards. On a plain
# `docker compose up` they are ordinary variables you set yourself.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-stockcli}
      POSTGRES_USER:     ${POSTGRES_USER:-stockcli}
      # Deliberately no `:?` guard, despite an unset password being genuinely
      # dangerous — it would create a database anyone on the compose network can
      # open.
      #
      # The reason is that `:?` is enforced during *interpolation*, and compose
      # interpolates on every command including `build`. Coolify builds with its
      # own build-time.env, which carries no runtime secrets, so the guard
      # aborted the deploy at the build step with a compose error — before the
      # image existed, and before the Environment Variables tab it told you to
      # use had been rendered.
      #
      # Nothing is lost by removing it: postgres:17-alpine already refuses to
      # initialise on an unset *or* empty password ("Database is uninitialized
      # and superuser password is not specified"), which is the same guarantee
      # enforced at the right moment, by the component that owns it. Empty
      # defaults keep interpolation total so no phase can fail on a missing
      # value; SERVICE_PASSWORD_POSTGRES is Coolify's generated secret and wins
      # when present.
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:-}}
      # Postgres interprets its own timestamps in this zone; the app stores
      # everything as timestamptz, so this only affects server-side logging.
      TZ:                ${TZ:-Europe/Berlin}
    volumes:
      - stock-db:/var/lib/postgresql/data
    ports:
      # Bound to the loopback interface only. The app container reaches Postgres
      # over the compose network and does not need this; it exists so `npm run
      # serve` on the host (and psql) can connect. Publishing it as plain
      # '5432:5432' would put the database on every interface of the host,
      # which on a deployed server means the public internet.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stockcli} -d ${POSTGRES_DB:-stockcli}']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  stock-cli:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        # Wait for the healthcheck, not just the container: the app runs its
        # migrations on boot and would otherwise race an initialising server.
        # It also retries on its own (see waitForDatabase), so this is belt and
        # braces rather than the only guard.
        condition: service_healthy
    environment:
      # Asks Coolify to allocate a domain and route it to this port. Coolify
      # sets the value; the app never reads it. Without it the deploy comes up
      # reachable only by IP:port.
      SERVICE_FQDN_STOCKCLI_4317: ${SERVICE_FQDN_STOCKCLI_4317:-}
      PORT: 4317
      # Must resolve to the same password the postgres service above received,
      # including when Coolify generated it.
      DATABASE_URL: postgres://${POSTGRES_USER:-stockcli}:${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:-}}@postgres:5432/${POSTGRES_DB:-stockcli}
      # Only EDGAR filings and generated reports live on disk now.
      DATA_DIR: /data
      # Postgres connections held open by the pool. The nightly pipeline is
      # serial and the API is light, so 10 is ample; it is here because the app
      # reads it, and a knob nobody can see is a knob nobody can turn.
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      # Cron schedules are interpreted in the timezone stored in the settings
      # row; this only sets the container's own clock display.
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      PPLX_API_KEY: ${PPLX_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DISTILL_API_KEY: ${DISTILL_API_KEY:-}
      DISTILL_API_URL: ${DISTILL_API_URL:-http://localhost:3000}
      DISTILL_BRIEFING_TYPE_ID: ${DISTILL_BRIEFING_TYPE_ID:-}
    ports:
      - '${PORT:-4317}:4317'
    volumes:
      # Named volume, not a bind mount: Docker seeds it from the image, so
      # /data arrives owned by the unprivileged `node` user the container runs
      # as. Much smaller than it used to be — the measurements moved to
      # Postgres and only the downloaded filings remain.
      - stock-files:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4317/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  stock-db:
  stock-files:
