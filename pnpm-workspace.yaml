# Two packages, one lockfile: the server at the root and the SPA in web/.
# They are genuinely coupled — web/src/types.ts imports server types across the
# package boundary — so installing them together is what keeps the two dependency
# trees resolvable from one `pnpm install`.
packages:
  - 'web'

# pnpm blocks postinstall scripts unless a package is answered for here, and an
# unanswered one fails the install rather than warning. esbuild needs its
# platform binary. The other two were inspected and neither does work we need:
# Hatchet's postinstall is a version-compatibility notice, and protobufjs runs
# fine unbuilt — both are recorded as a deliberate `false`, not left open.
allowBuilds:
  esbuild: true
  '@hatchet-dev/typescript-sdk': false
  protobufjs: false
